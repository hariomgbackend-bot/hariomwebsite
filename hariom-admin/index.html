<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hariom Electronics — Admin Portal</title>
  <link rel="icon" href="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <img src="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png" alt="Hariom Electronics" />
      </div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Hariom Electronics &mdash; Inventory &amp; CRM</p>
      <form id="login-form" class="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="hariom_elect@live.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="login-error hidden"></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-footer">Hariom Electronics &middot; Internal Use Only</p>
    </div>
  </div>

  <!-- DASHBOARD SHELL -->
  <div id="dashboard" class="dashboard hidden">
    <button id="mobile-menu-btn" class="mobile-toggle admin-mobile-toggle" aria-label="Open menu">&#9776;</button>
    <div id="mobile-menu-backdrop" class="mobile-backdrop hidden"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png" alt="Hariom" />
        <div>
          <div class="sidebar-brand-name">Hariom Admin</div>
          <div class="sidebar-brand-sub">Electronics Store</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Overview</div>
        <button class="nav-btn active" data-module="dashboard">
          <span class="nav-icon-wrap">&#9632;</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-btn" data-module="published">
          <span class="nav-icon-wrap">&#9679;</span>
          <span class="nav-label">Published</span>
        </button>

        <div class="sidebar-section-label">Catalog</div>
        <button class="nav-btn" data-module="stock">
          <span class="nav-icon-wrap">&#9783;</span>
          <span class="nav-label">Stock &amp; Pricing</span>
        </button>
        <button class="nav-btn" data-module="categories">
          <span class="nav-icon-wrap">&#9776;</span>
          <span class="nav-label">Categories</span>
        </button>
        <button class="nav-btn" data-module="brands">
          <span class="nav-icon-wrap">&#9733;</span>
          <span class="nav-label">Brands</span>
        </button>
        <button class="nav-btn" data-module="offers">
          <span class="nav-icon-wrap">&#9733;</span>
          <span class="nav-label">Offers &amp; Campaigns</span>
        </button>

        <div class="sidebar-section-label">Operations</div>
        <button class="nav-btn" data-module="enquiries">
          <span class="nav-icon-wrap">&#9993;</span>
          <span class="nav-label">Live Enquiries</span>
          <span id="enquiry-badge" class="badge hidden">0</span>
        </button>
        <button class="nav-btn" data-module="orders">
          <span class="nav-icon-wrap">&#9745;</span>
          <span class="nav-label">Orders</span>
        </button>
        <button class="nav-btn" data-module="returns">
          <span class="nav-icon-wrap">&#8634;</span>
          <span class="nav-label">Returns</span>
        </button>
        <button class="nav-btn" data-module="customers">
          <span class="nav-icon-wrap">&#128101;</span>
          <span class="nav-label">Customers</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-row">
          <div class="sidebar-user-avatar" id="user-avatar">A</div>
          <span id="user-email" class="sidebar-user"></span>
        </div>
        <button id="logout-btn" class="btn btn-outline btn-sm btn-block">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content"></main>
  </div>

  <!-- Hidden audio -->
  <audio id="enquiry-alert" preload="auto" style="display:none">
    <source src="audio/alert.wav" type="audio/wav" />
  </audio>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-storage-compat.js"></script>

  <!-- App -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils/audio-alert.js"></script>
  <script src="js/utils/table.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/stock.js"></script>
  <script src="js/modules/offers.js"></script>
  <script src="js/modules/enquiries.js"></script>
  <script src="js/modules/orders.js"></script>
  <script src="js/modules/returns.js"></script>
  <script src="js/modules/categories.js"></script>
  <script src="js/modules/brands.js"></script>
  <script src="js/modules/customers.js"></script>
  <script src="js/modules/published.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
