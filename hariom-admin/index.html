<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hariom Electronics — Admin Portal</title>
  <link rel="icon" href="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <!-- ── LOGIN SCREEN ── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <img src="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png"
             alt="Hariom Electronics" />
      </div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Hariom Electronics — Inventory &amp; CRM</p>
      <form id="login-form" class="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="hariom_elect@live.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="login-error hidden"></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-footer">Hariom Electronics &middot; Internal Use Only</p>
    </div>
  </div>

  <!-- ── DASHBOARD SHELL ── -->
  <div id="dashboard" class="dashboard hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="https://raw.githubusercontent.com/hariomgbackend-bot/hariomwebsite/main/public/logo-icon.png"
             alt="Hariom" />
        <span class="sidebar-brand-text">Hariom Admin</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-module="dashboard">
          <span class="nav-icon">&#9632;</span> Dashboard
        </button>
        <button class="nav-btn" data-module="stock">
          <span class="nav-icon">&#9776;</span> Stock &amp; Pricing
        </button>
        <button class="nav-btn" data-module="offers">
          <span class="nav-icon">&#9733;</span> Offers &amp; Campaigns
        </button>
        <button class="nav-btn" data-module="enquiries">
          <span class="nav-icon">&#9993;</span> Live Enquiries
          <span id="enquiry-badge" class="badge hidden">0</span>
        </button>
        <button class="nav-btn" data-module="categories">
          <span class="nav-icon">&#9776;</span> Website Categories
        </button>
        <button class="nav-btn" data-module="published">
          <span class="nav-icon">&#9679;</span> Published
        </button>
      </nav>
      <div class="sidebar-footer">
        <span id="user-email" class="sidebar-user"></span>
        <button id="logout-btn" class="btn btn-outline btn-sm">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Modules are loaded here by app.js -->
    </main>
  </div>

  <!-- ── HIDDEN AUDIO ELEMENT FOR ENQUIRY ALERT ── -->
  <audio id="enquiry-alert" preload="auto" style="display:none">
    <source src="audio/alert.wav" type="audio/wav" />
  </audio>

  <!-- ── SCRIPTS ── -->
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-auth-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/11.5.0/firebase-storage-compat.js">
  </script>

  <!-- App modules -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils/audio-alert.js"></script>
  <script src="js/utils/table.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/stock.js"></script>
  <script src="js/modules/offers.js"></script>
  <script src="js/modules/enquiries.js"></script>
  <script src="js/modules/categories.js"></script>
  <script src="js/modules/published.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
